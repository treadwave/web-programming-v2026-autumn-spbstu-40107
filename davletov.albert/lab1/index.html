<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <form class="registration-form">
      <input type="text" class="form-input" placeholder="Имя" />
      <input type="email" class="form-input" placeholder="E-mail" />
      <input type="tel" class="form-input" placeholder="Телефон" />
      <input type="password" class="form-input" placeholder="Пароль" />
      <input type="password" class="form-input" placeholder="Пароль еще раз" />
      <button type="submit" class="form-button">Регистрация</button>
    </form>
  </body>
</html>
